# Read by SonarQube Cloud Automatic Analysis, which is how this repository is
# scanned: no workflow here runs a scan, so there is no scanner to read a
# `sonar-project.properties` — Automatic Analysis ignores that filename. It is
# the one to add alongside a `sonarqube-scan-action` step, the way `lemonfiber`
# does it.
#
# Automatic Analysis takes the project key and organisation from the repository
# binding, so neither is set here.
#
# `vendor/` is the submodules: nine other repositories, pinned and rendered here
# and never edited here (REPO-R45), so a finding in one belongs to the
# repository that owns it. `src/content/` is the collection they enter by
# symlink, and is prose on either side of that. `src/paraglide/` is generated by
# `npm run messages` and rewritten whole on every run, so a finding there cannot
# be fixed where it is reported.
sonar.exclusions=src/paraglide/**,src/content/**,vendor/**,dist/**,coverage/**,.astro/**

sonar.sourceEncoding=UTF-8

# Coverage is not here because Automatic Analysis cannot import it. The 100%
# line-coverage gate is `npm run coverage`, enforced by the `gate` workflow; a
# `sonar.javascript.lcov.reportPaths` needs a scanner run to read it.
