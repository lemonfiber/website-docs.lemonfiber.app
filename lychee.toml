# A site route is not a source path: `/start/what-lemonfiber-is/` is a page the
# build produces, not a file in the checkout. starlight-links-validator resolves
# those against the real route table and fails the build on any that do not.
# lychee checks what leaves the site.
exclude = ["^file:"]
exclude_loopback = true
max_retries = 2
accept = ["200", "206", "429"]
