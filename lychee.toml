# A site route is not a source path: `/start/what-lemonfiber-is/` is a page the
# build produces, not a file in the checkout. The root directory lets lychee
# resolve such a link far enough to recognise it as local; the exclusion then
# leaves it to starlight-links-validator, which resolves routes against the real
# route table and fails the build on any that do not. lychee checks what leaves
# the site.
#
# This is the file the org-shared `hygiene` job reads, and that job checks out
# without submodules, so the scan it configures sees this repository's own
# markdown and none of the nine repositories rendered from `vendor/`. The scan
# over the built site, which is where mirrored prose exists, is configured by
# `lychee-site.toml` and run by the `links` workflow.
root_dir = "/home/runner/work/website-docs.lemonfiber.app/website-docs.lemonfiber.app"
exclude = ["^file:"]
exclude_loopback = true
max_retries = 2
# There is deliberately no `accept` list here.
#
# There was one — `["200", "206", "429"]` — and it never ran. The shared hygiene
# workflow passes `--accept` on the command line, and a command-line argument
# beats a config file, so this file's list was decoration. It happened to be
# identical to the one that ran, which is why nobody noticed it was dead.
#
# That is the worse half of the duplication: not two values disagreeing, but two
# values agreeing while only one is consulted. Somebody editing this one to fix a
# failing link check would watch it keep failing and have no idea why.
#
# The list lives in `lemonfiber/spec`'s `hygiene.yml`, which is also where the
# reasoning for each accepted code is written.
