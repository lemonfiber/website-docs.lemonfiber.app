# Dependency updates (spec ADR-0016).
#
# One file per repo. Dependabot cannot extend a shared preset the way Renovate
# could, so this is copied rather than inherited and kept alike by review.
#
# The pull requests it opens cite nothing — Dependabot composes its own commit
# message and offers no way to add a `Spec:` trailer. `spec_check.py` supplies
# `GOV-R12` for a pull request GitHub says `dependabot[bot]` opened (Q-R55).
#
# Not configured here, deliberately:
#   - the nine repositories under `vendor/`. Those revisions are bumped on
#     purpose; the `pins` workflow here is what notices one going stale.
#   - `.nvmrc`. Dependabot has no manager that reads it, and nothing else
#     watches it — see the spec's 40-quality/tooling.md, "What Dependabot does
#     not watch".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
    # A release waits three days before it is offered. The shared gates are
    # excluded from that wait: a repo running a stale gate is the failure this
    # grouping exists to prevent, and the delay is the whole cost of it.
    # Security updates are never subject to cooldown.
    cooldown:
      default-days: 3
      exclude: ["lemonfiber/spec*"]
    groups:
      # First match wins, so the shared gates are claimed before the wildcard.
      shared-workflows:
        patterns: ["lemonfiber/spec*"]
      # The three that publish the site are one pipeline: one configures it, one
      # produces the artefact, one deploys that artefact. `upload-pages-artifact`
      # v5 moved to `upload-artifact` v7, which changes what the deploy consumes,
      # so a partial upgrade is a state nobody chose — and the deploy runs only on
      # `main`, where a green check on a pull request cannot have said otherwise.
      #
      # Majors are grouped here and nowhere else. The judgement is still a
      # judgement; it is one about the pipeline rather than three that have to be
      # made the same way and in the right order.
      pages:
        patterns:
          - "actions/configure-pages"
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"
        update-types: ["major", "minor", "patch"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["lemonfiber/spec*"]
        # Majors are left out, so each arrives on its own carrying `major`.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
