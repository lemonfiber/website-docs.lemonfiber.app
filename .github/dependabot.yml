# Dependency updates (spec ADR-0016).
#
# One file per repo. Dependabot cannot extend a shared preset the way Renovate
# could, so this is copied rather than inherited and kept alike by review.
#
# The pull requests it opens cite nothing — Dependabot composes its own commit
# message and offers no way to add a `Spec:` trailer. `spec_check.py` supplies
# `GOV-R12` for a pull request GitHub says `dependabot[bot]` opened (Q-R55).
#
# Not configured here, deliberately:
#   - the repositories under `vendor/`. `bump-pins` takes those in one pull
#     request, and `pins-sources` refuses when one stalls.
#   - `.nvmrc`. Dependabot has no manager that reads it, and nothing else
#     watches it — see the spec's 40-quality/tooling.md, "What Dependabot does
#     not watch".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
    # lemonfiber/spec's workflows are moved by the release train's one rolling
    # bump pull request (OPS-R85), never by this updater.
    ignore:
      - dependency-name: "lemonfiber/spec*"
    groups:
      # The three that publish the site are one pipeline: one configures it, one
      # produces the artefact, one deploys that artefact. `upload-pages-artifact`
      # v5 moved to `upload-artifact` v7, which changes what the deploy consumes,
      # so a partial upgrade is a state nobody chose — and the deploy runs only on
      # `main`, where a green check on a pull request cannot have said otherwise.
      #
      # Majors are grouped here and for the `vitest` pair below, and nowhere
      # else. The judgement is still a judgement; it is one about the pipeline
      # rather than three that have to be made the same way and in the right
      # order.
      pages:
        patterns:
          - "actions/configure-pages"
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"
        update-types: ["major", "minor", "patch"]
      actions:
        patterns: ["*"]
        # Majors are left out, so each arrives on its own carrying `major`.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 3
    groups:
      # First match wins, so the pair is claimed before the wildcard.
      #
      # `@vitest/coverage-v8@X` declares an exact peer on `vitest@X` — the same
      # version down to the patch — so the two are one upgrade wearing two
      # names. Offered apart, neither pull request can go green: each resolves
      # against the other package's unchanged pin and `npm ci` refuses with
      # `ERESOLVE`. A partial upgrade is a state nobody chose, and here it is not
      # even a state that can be reached, in either order.
      #
      # So majors are grouped for this pair as they are for the pages pipeline
      # above.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
        update-types: ["major", "minor", "patch"]
      npm:
        patterns: ["*"]
        # Majors are left out, so each arrives on its own carrying `major`.
        update-types: ["minor", "patch"]
