# The gates every repo in the org shares, kept in one place so improving one
# improves all of them. Pinned by commit, bumped deliberately.
name: ci

on: [pull_request]

permissions:
  contents: read

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@8822a12263feead066c100805e976b54cb316548 # main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@8822a12263feead066c100805e976b54cb316548 # main
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@8822a12263feead066c100805e976b54cb316548 # main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@8822a12263feead066c100805e976b54cb316548 # main
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@8822a12263feead066c100805e976b54cb316548 # main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@8822a12263feead066c100805e976b54cb316548 # main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@8822a12263feead066c100805e976b54cb316548 # main
