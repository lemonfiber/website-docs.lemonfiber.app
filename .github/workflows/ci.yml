# The gates every repo in the org shares, kept in one place so improving one
# improves all of them. Pinned by commit, bumped deliberately.
name: ci

on: [pull_request]

permissions:
  contents: read

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@578850cd7cc9c81ed1664ce7885c9b93aeeab564 # v1.0.23
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@578850cd7cc9c81ed1664ce7885c9b93aeeab564 # v1.0.23
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@578850cd7cc9c81ed1664ce7885c9b93aeeab564 # v1.0.23
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@578850cd7cc9c81ed1664ce7885c9b93aeeab564 # v1.0.23
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@578850cd7cc9c81ed1664ce7885c9b93aeeab564 # v1.0.23
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@578850cd7cc9c81ed1664ce7885c9b93aeeab564 # v1.0.23
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@578850cd7cc9c81ed1664ce7885c9b93aeeab564 # v1.0.23
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@578850cd7cc9c81ed1664ce7885c9b93aeeab564 # v1.0.23
