# This site renders its sibling repositories from pinned revisions (ADR-0015,
# REPO-R46). Whether a pin has gone behind on a source a page renders, and
# for how long, is spec's shared `site-pins`, run over this site's own
# `scripts/pins.ts` (Q-R68, Q-R70).
name: pins

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily: `age` measures in days, and `sources` says a stall here when no
    # pull request is open to show it on.
    - cron: "40 7 * * *"

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pins:
    uses: lemonfiber/spec/.github/workflows/site-pins.yml@98f21cb8a4db83cfc079c1a848d977818af80c70 # v1.0.115
    with:
      requirement: REPO-R46
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
