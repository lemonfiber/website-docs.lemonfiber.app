# This site renders nine repositories from pinned revisions, which is the design
# (ADR-0015, REPO-R46): a reader gets a page that agrees with itself, and a
# revision is bumped deliberately rather than drifting under the build.
#
# The cost of that is a gate can be correct and still pass on the wrong input.
# `every-error-by-code.md` claims to list every error lemonfiber can raise, and a
# check holds it to the codes the vendored source declares — bidirectional, and
# it works. It passed while the page was missing two codes, because the pin sat
# one commit before the code that raises them. Nothing was broken; the artefact
# was old.
#
# So `age` asks the question no other check asked: how long has a pin been
# behind? Not how many commits — a pin eleven commits and six hours behind is
# fine, and one two commits and three months behind is not.
#
# Duration answers abandonment, and only abandonment. It happened again on the
# read-endpoint table: `api/the-envelope` named six endpoints and the listing
# guard agreed with it in both directions, out of a contract upstream had
# already grown. The pin was two days behind, and `age` called every pin
# healthy. So `sources` asks the other half — has a pin gone behind on a file a
# guard here reads? — with no window at all. It names the commits rather than
# counting them: most of what a repository commits touches nothing this site
# reads.
name: pins

on:
  workflow_dispatch:
  schedule:
    # Weekly. A pin is bumped deliberately, so a daily nag would mostly report
    # the same considered decision back at whoever made it.
    - cron: "40 7 * * 1"

permissions:
  contents: read

jobs:
  age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # Whole histories. The default is a shallow fetch, and a shallow
          # submodule can only see one commit — so counting what a pin has not
          # taken gives 1 whatever the truth is, and the age of the oldest
          # unpinned commit becomes the age of the newest. The measure would
          # read `0d` on a pin a year behind.
          fetch-depth: 0
          persist-credentials: false

      - name: How long each pin has been behind
        env:
          # Days a pin may lag before it is staleness rather than a decision.
          ALLOWED_DAYS: "21"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import time

          allowed = int(os.environ["ALLOWED_DAYS"]) * 86400
          now = time.time()


          def git(path, *args):
              done = subprocess.run(
                  ["git", "-C", path, *args], capture_output=True, text=True
              )
              return done.stdout.strip() if done.returncode == 0 else None


          listing = subprocess.run(
              ["git", "submodule", "status"], capture_output=True, text=True
          ).stdout

          stale = []
          print(f"{'repository':<26} {'pinned':<9} {'behind':>6}  stale for")
          for line in listing.splitlines():
              found = re.match(r"[-+ ]?([0-9a-f]{40})\s+(\S+)", line)
              if not found:
                  continue
              sha, path = found.groups()
              name = path.split("/")[-1]

              git(path, "fetch", "--quiet", "origin")
              behind = git(path, "rev-list", "--count", f"{sha}..origin/main")
              if behind is None:
                  print(f"{name:<26} {sha[:7]:<9} {'?':>6}  could not be read")
                  continue

              # The oldest commit this pin has not taken. How long the site has
              # been rendering without it is what makes a pin stale, not how many
              # arrived since.
              oldest = git(path, "log", "--format=%ct", "--reverse", f"{sha}..origin/main")
              waited = now - int(oldest.splitlines()[0]) if oldest else 0
              days = int(waited // 86400)

              says = "current" if behind == "0" else f"{days}d"
              print(f"{name:<26} {sha[:7]:<9} {behind:>6}  {says}")
              if waited > allowed:
                  # Named, not counted: what a bump would take is the decision,
                  # and a number does not put it in front of anyone (Q-R68).
                  taken = git(path, "log", "--format=%h %cs %s", f"{sha}..origin/main") or ""
                  listed = "\n".join(f"  {one}" for one in taken.splitlines())
                  stale.append(
                      f"{name}: {behind} commits not taken, oldest {days} days old\n{listed}"
                  )

          if not stale:
              print("\nevery pin is within the window.")
              raise SystemExit(0)

          print("\n" + "\n".join(stale))
          print(
              "::error::a pinned revision has been behind for longer than the window. "
              "Bump it with `git submodule update --remote <path>` and check the pages it renders."
          )
          raise SystemExit(1)
          PY

  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # Whole histories, for the reason `age` needs them: a shallow
          # submodule cannot be asked what it has not taken.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # No install step. The check imports the declarations themselves and
      # nothing from `node_modules`, so the node this repository declares is
      # the whole of what it needs.
      - name: Which pins have gone behind on a source a guard reads
        run: node scripts/pins.ts
