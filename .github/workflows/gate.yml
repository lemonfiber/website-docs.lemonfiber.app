# This repo's own gate: format, lint, types, structural guards, 100% coverage,
# the build, the addresses the build sends a reader away to, and the
# accessibility sweep. Everything it runs is a script `npm run ci` also runs
# locally, so a red pipeline is reproducible on a laptop.
name: gate

on: [pull_request]

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether this change reaches anything but formatting. Of what `npm run ci`
  # checks, only Prettier reads the agent guides and the licence: the guards
  # read the readme and every page under `src/content/docs/`, and the build
  # renders those pages, so neither is on the list. A change to the listed
  # files alone, added or modified, is checked for formatting and nothing else.
  # Anything else runs the whole gate, and so does a file deleted or renamed, a
  # change with no base to compare against, or this job failing.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, so the base is here to compare against, and no file
          # contents but the checkout's: the comparison reads trees.
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No commit to compare against, so the gate runs."
            exit 0
          fi
          changed="$(git diff --no-renames --name-status "${BASE}" HEAD)"
          code=false
          while IFS=$'\t' read -r status path; do
            case "${status}:${path}" in
            : | [AM]:AGENTS.md | [AM]:CLAUDE.md | [AM]:LICENSE) ;;
            *) code=true ;;
            esac
          done <<< "${changed}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = false ]; then
            echo "Only files Prettier alone reads changed; the rest of the gate is skipped."
          fi

  gate:
    name: gate
    needs: scope
    # Runs whatever `what changed` said, so the required `gate` always reports:
    # where the change reaches only the listed files, it checks their formatting
    # and skips the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CODE: ${{ needs.scope.result != 'success' || needs.scope.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The nine repositories under `vendor/`, and not the submodules
          # they carry themselves. `lemonfiber` embeds
          # `lemonfiber-media-stack`; this site renders the stack from its
          # own pin at `vendor/lemonfiber-media-stack`, and reads that copy
          # for the page's revision stamp, so the nested one is never read.
          # A change that reaches only the listed files reads none of them.
          submodules: ${{ env.CODE }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exactly what the lockfile says
        run: npm ci --ignore-scripts

      - name: The files Prettier alone reads are formatted
        if: env.CODE != 'true'
        run: ./node_modules/.bin/prettier --check --ignore-unknown AGENTS.md CLAUDE.md LICENSE

      - name: Install the browser the accessibility sweep drives
        if: env.CODE == 'true'
        run: npm run browser

      - name: Run the gate
        if: env.CODE == 'true'
        run: npm run ci
