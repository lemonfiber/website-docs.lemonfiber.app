# This repo's own gate: format, lint, types, structural guards, 100% coverage,
# and the build. Everything it runs is a script `npm run ci` also runs locally,
# so a red pipeline is reproducible on a laptop.
name: gate

on: [pull_request]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Install the browser the accessibility sweep drives
        run: npm run browser

      - name: Run the gate
        run: npm run ci
