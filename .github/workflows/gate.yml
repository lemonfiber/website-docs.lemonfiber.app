# This repo's own gate: format, lint, types, structural guards, 100% coverage,
# and the build. Everything it runs is a script `npm run ci` also runs locally,
# so a red pipeline is reproducible on a laptop.
name: gate

on: [pull_request]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The nine repositories under `vendor/`, and not the submodules
          # they carry themselves. `lemonfiber` embeds
          # `lemonfiber-media-stack`; this site renders the stack from its
          # own pin at `vendor/lemonfiber-media-stack`, and reads that copy
          # for the page's revision stamp, so the nested one is never read.
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exactly what the lockfile says
        run: npm ci --ignore-scripts

      - name: Install the browser the accessibility sweep drives
        run: npm run browser

      - name: Run the gate
        run: npm run ci
