# Post/update a sticky PR comment linking this PR's cited spec identifiers to
# their defining files. Reusable lives in the spec repo.
#
# This repository holds its pages to nine vendored sources and cites the
# identifiers those pages are about. A reviewer had the identifier and no link
# to what it says.
name: spec-references
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
jobs:
  refs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-references.yml@fa446d8dbc63dde506b688511b612f83ef448ac5 # v1.0.8
