# Publishes the built site to GitHub Pages. The build runs the same way CI runs
# it, from the submodule revisions this repository pins.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default, rather than nothing written down: an absent `permissions`
# key falls back to the repository's setting, which can be wider than this. Each
# job below asks for exactly what it needs, so neither holds the other's.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The nine repositories under `vendor/`, and not the submodules
          # they carry themselves. `lemonfiber` embeds
          # `lemonfiber-media-stack`; this site renders the stack from its
          # own pin at `vendor/lemonfiber-media-stack`, and reads that copy
          # for the page's revision stamp, so the nested one is never read.
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build the site
        run: npm run messages && npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
