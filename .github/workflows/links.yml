# The addresses this site sends a reader to, fetched over the built site on a
# schedule, through spec's shared `site-links` (REPO-R48). It reports, and
# gates nothing.
name: links

on:
  workflow_dispatch:
  schedule:
    # Daily, off the hour.
    - cron: "25 5 * * *"

permissions:
  contents: read

jobs:
  links:
    uses: lemonfiber/spec/.github/workflows/site-links.yml@a3a5049ee28c2261cc6728db8b48fdf1083b4eca # v1.0.119
    with:
      requirement: REPO-R48
      timeout-minutes: 70
