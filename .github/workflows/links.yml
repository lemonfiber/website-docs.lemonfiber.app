# The addresses this site sends a reader to, fetched over the built site on a
# schedule, through spec's shared `site-links` (REPO-R48). It reports, and
# gates nothing.
name: links

on:
  workflow_dispatch:
  schedule:
    # Daily, off the hour.
    - cron: "25 5 * * *"

permissions:
  contents: read

jobs:
  links:
    uses: lemonfiber/spec/.github/workflows/site-links.yml@10e9f8c34b6aff73cf343c9497f91982633724e6 # v1.0.94
    with:
      requirement: REPO-R48
      timeout-minutes: 70
