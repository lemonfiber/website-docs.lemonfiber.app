# The addresses this site sends a reader to, fetched over the built site on a
# schedule, through spec's shared `site-links` (REPO-R48). It reports, and
# gates nothing.
name: links

on:
  workflow_dispatch:
  schedule:
    # Daily, off the hour.
    - cron: "25 5 * * *"

permissions:
  contents: read

jobs:
  links:
    uses: lemonfiber/spec/.github/workflows/site-links.yml@f19777c73feb01457787e5c4dd92eee17bc1feda # v1.0.116
    with:
      requirement: REPO-R48
      timeout-minutes: 70
