# Keep this repo's labels in sync with the canonical set in the spec.
#
# Eleven labels here, never compared to anything. The triage automations match
# labels by name, so a divergence is not cosmetic — it is a rule that quietly
# stops matching, and stops without going red.
name: labels
on:
  workflow_dispatch:
  schedule:
    - cron: "49 4 * * 1"
permissions:
  contents: read
jobs:
  sync:
    permissions:
      contents: read
      issues: write
    uses: lemonfiber/spec/.github/workflows/label-sync.yml@f368b52cac7510f5903f04d8884a27b3c33d0b11 # v1.0.92
