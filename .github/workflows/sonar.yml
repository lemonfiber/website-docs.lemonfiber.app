# Gate this repo's PRs on zero new SonarCloud issues.
#
# The scan is SonarCloud Automatic Analysis against
# `lemonfiber_website-docs.lemonfiber.app`; there is no scan job here. This reads
# the summary that analysis posts and enforces the standard the free plan's own
# quality gate cannot (Q-R64), through the shared reusable in spec so every repo
# gates identically.
#
# This repository had no such workflow, so the standard was not enforced here at
# all — while the project's own quality gate sat at ERROR with nothing reading
# it. What it was reporting was mostly not ours: `vendor/` carries nine other
# repositories as submodules, and until those were excluded they made up the
# large majority of the analysed lines, so the findings were about other repos'
# source reached through this tree.
name: sonar
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@93bf49c96ae5b12e49daea523b1d66ae294babb0 # main
    with:
      allowed-open: 1
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
